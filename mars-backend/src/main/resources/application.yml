spring:
  application:
    name: mars-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Istanbul

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mars:
  cors:
    allowed-origins: ${MARS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${MARS_JWT_SECRET:MARS_DEV_JWT_SECRET_KEY_CHANGE_ME_32CHARS_MIN}
    expiration-ms: ${MARS_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.mars: INFO
