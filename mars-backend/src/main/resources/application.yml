spring:
  application:
    name: mars-backend
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Istanbul

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mars:
  cors:
    allowed-origins: ${MARS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${MARS_JWT_SECRET:MARS_DEV_JWT_SECRET_KEY_CHANGE_ME_32CHARS_MIN}
    expiration-ms: ${MARS_JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    test-recipient: ${MAIL_TEST_RECIPIENT:}
    reminder-scan-ms: ${MAIL_REMINDER_SCAN_MS:60000}
    reminder-window-minutes: ${MAIL_REMINDER_WINDOW_MINUTES:2}

logging:
  level:
    root: INFO
    com.mars: INFO
