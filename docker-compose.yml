services:
  postgres:
    image: postgres:16-alpine
    container_name: mars-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mars_db}
      POSTGRES_USER: ${POSTGRES_USER:-mars_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mars_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mars_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mars-network

  backend:
    build:
      context: ./mars-backend
      dockerfile: Dockerfile
    container_name: mars-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/mars_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-mars_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mars_password}
      MARS_CORS_ALLOWED_ORIGINS: ${MARS_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mars-network

  frontend:
    build:
      context: ./mars-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: mars-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - mars-network

volumes:
  mars_pg_data:

networks:
  mars-network:
    driver: bridge
