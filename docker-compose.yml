services:
  postgres:
    image: postgres:16-alpine
    container_name: mars-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - mars_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mars-network

  backend:
    build:
      context: ./mars-backend
      dockerfile: Dockerfile
    container_name: mars-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MARS_CORS_ALLOWED_ORIGINS: ${MARS_CORS_ALLOWED_ORIGINS}
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mars-network

  frontend:
    build:
      context: ./mars-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: mars-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend
    networks:
      - mars-network

volumes:
  mars_pg_data:

networks:
  mars-network:
    driver: bridge
